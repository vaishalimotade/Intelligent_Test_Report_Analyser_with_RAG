apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-report-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-report-backend
  template:
    metadata:
      labels:
        app: test-report-backend
    spec:
      containers:
        - name: backend
          image: test-report-analyzer-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/test_analyzer
            - name: AZURE_OPENAI_ENDPOINT
              value: https://your-azure-openai-endpoint
            - name: AZURE_OPENAI_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: azure-openai-key
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-secret
                  key: webhook
            - name: EMAIL_SMTP_HOST
              value: smtp.example.com
            - name: EMAIL_SMTP_PORT
              value: '587'
            - name: EMAIL_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: user
            - name: EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: password
            - name: NOTIFICATION_FROM_EMAIL
              value: noreply@example.com
            - name: NOTIFICATION_ADMIN_EMAIL
              value: alerts@example.com
            - name: CHROMADB_DIR
              value: /data/chromadb
          volumeMounts:
            - name: chroma-volume
              mountPath: /data/chromadb
      volumes:
        - name: chroma-volume
          persistentVolumeClaim:
            claimName: chroma-pvc
