apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-report-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-report-backend
  template:
    metadata:
      labels:
        app: test-report-backend
    spec:
      containers:
        - name: backend
          image: test-report-analyzer-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: MONGODB_URL
              value: mongodb://test-report-mongo:27017
            - name: MONGODB_DATABASE
              value: test_analyzer
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: openai-api-key
            - name: OPENAI_EMBEDDING_MODEL
              value: text-embedding-3-large
            - name: OPENAI_CHAT_MODEL
              value: gpt-4o-mini
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-secret
                  key: webhook
            - name: EMAIL_SMTP_HOST
              value: smtp.example.com
            - name: EMAIL_SMTP_PORT
              value: '587'
            - name: EMAIL_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: user
            - name: EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: password
            - name: NOTIFICATION_FROM_EMAIL
              value: noreply@example.com
            - name: NOTIFICATION_ADMIN_EMAIL
              value: alerts@example.com
            - name: CHROMADB_DIR
              value: /data/chromadb
          volumeMounts:
            - name: chroma-volume
              mountPath: /data/chromadb
      volumes:
        - name: chroma-volume
          persistentVolumeClaim:
            claimName: chroma-pvc
