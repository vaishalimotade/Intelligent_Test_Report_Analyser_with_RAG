apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-report-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-report-postgres
  template:
    metadata:
      labels:
        app: test-report-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: test_analyzer
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
